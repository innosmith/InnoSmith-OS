# Production Environment: Standalone (eigene Postgres, Backend, Frontend)
# Nutzt shared LiteLLM + Ollama vom Host
#
# Starten mit:
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Oder via Makefile: make prod

services:
  postgres-prod:
    image: pgvector/pgvector:pg16
    container_name: taskpilot-postgres-prod
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_USER: ${TP_DB_USER}
      POSTGRES_PASSWORD: ${TP_DB_PASSWORD}
      POSTGRES_DB: ${TP_DB_NAME}
    volumes:
      - ${HOME}/.local/share/taskpilot/postgres/prod:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed-prod.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TP_DB_USER} -d ${TP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: taskpilot-backend:prod
    container_name: taskpilot-backend-prod
    ports:
      - "127.0.0.1:8200:8000"
    env_file: ../.env.prod
    environment:
      TP_APP_ENV: prod
      TP_DB_HOST: postgres-prod
      TP_DB_PORT: "5432"
      TP_LITELLM_BASE_URL: http://taskpilot-litellm:4000
      TP_OLLAMA_BASE_URL: http://host.docker.internal:11434
      TP_INVOICEINSIGHT_URL: http://host.docker.internal:8055/mcp
      TP_CLAMAV_HOST: clamav
      TP_MCP_BASE_DIR: /app
      # Code-Sandbox laeuft im Sandbox-Executor-Sidecar (taskpilot-shared-Netz).
      # Der Token kommt aus ../.env.prod (TP_SANDBOX_EXECUTOR_TOKEN).
      TP_SANDBOX_EXECUTOR_URL: http://taskpilot-sandbox-executor:8090
      # Datenraum: pfadgleich gemountet, damit Backend (schreibend) und Executor
      # (der den Pfad an `docker run -v` weiterreicht) dieselbe Stelle meinen.
      # Ohne explizite Variable waere $HOME im Container /home/taskpilot -- ein
      # Pfad, den der Host-Daemon nicht aufloesen kann.
      TP_DATENRAUM_DIR: ${HOME}/.local/share/taskpilot/datenraum
    volumes:
      - prod-uploads:/app/uploads
      - prod-exports:/tmp/taskpilot-exports
      - ${HOME}/.hermes:/home/taskpilot/.hermes
      - ${HOME}/OneDrive/Finanzen/Kreditoren:${HOME}/OneDrive/Finanzen/Kreditoren:ro
      - ${HOME}/.local/share/taskpilot/datenraum:${HOME}/.local/share/taskpilot/datenraum
      # Schreibend, und das ist der Zweck: der Abgleich ergänzt Vorschläge, offene
      # Fragen und «kommt nur in einem System vor» selbst. Läge die Datei nur im
      # Abbild, wäre jede dieser Erkenntnisse beim nächsten Bauen weg -- die
      # Pflege liefe stündlich neu und käme nie an. So landet sie im
      # Arbeitsbaum und wird über `git diff` prüfbar, wie vorgesehen.
      - ../docs/kundenschluessel.yaml:/app/docs/kundenschluessel.yaml
    # no-new-privileges deaktiviert: Kernel 6.17-nvidia blockt jede exec mit diesem Flag
    # Security durch non-root User (taskpilot) + Cloudflare Zero Trust gewaehrleistet
    depends_on:
      postgres-prod:
        condition: service_healthy
      clamav:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - taskpilot-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Dedizierter Index-Daemon: selbes Image wie backend-prod, aber ohne API.
  # Uebernimmt die gesamte Vektorisierung (E-Mails ueber alle Ordner voll paginiert
  # + OneDrive-Dokumente mit Ausschlussfilter) in einer Endlosschleife. Der
  # In-Process-Scheduler im Backend ist per search_index_in_process=False deaktiviert.
  indexer-prod:
    image: taskpilot-backend:prod
    container_name: taskpilot-indexer-prod
    command: ["python", "-m", "app.scripts.index_daemon"]
    env_file: ../.env.prod
    environment:
      TP_APP_ENV: prod
      TP_DB_HOST: postgres-prod
      TP_DB_PORT: "5432"
      TP_LITELLM_BASE_URL: http://taskpilot-litellm:4000
      TP_OLLAMA_BASE_URL: http://host.docker.internal:11434
      TP_MCP_BASE_DIR: /app
    volumes:
      - ${HOME}/.hermes:/home/taskpilot/.hermes
    depends_on:
      postgres-prod:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - taskpilot-shared
    restart: unless-stopped

  frontend-prod:
    build:
      context: ../src/frontend
      dockerfile: ../../docker/Dockerfile.frontend
      args:
        CACHEBUST: ${CACHEBUST:-1}
    container_name: taskpilot-frontend-prod
    ports:
      - "127.0.0.1:3200:80"
    environment:
      BACKEND_HOST: backend-prod
    depends_on:
      backend-prod:
        condition: service_healthy
    restart: unless-stopped

  clamav:
    image: clamav/clamav-debian:unstable
    container_name: taskpilot-clamav
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep -q PONG"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  prod-uploads:
    name: taskpilot-prod-uploads
  prod-exports:
    name: taskpilot-prod-exports
  clamav-data:
    name: taskpilot-clamav-data

networks:
  # Gemeinsames Netz mit der Shared-Infra (litellm), damit backend-prod den
  # Proxy ueber den Container-Namen taskpilot-litellm erreicht.
  taskpilot-shared:
    external: true
