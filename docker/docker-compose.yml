# Shared Infrastructure: Postgres (Dev + Integration DBs) + LiteLLM
# Gestartet mit: docker compose -f docker/docker-compose.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: taskpilot-postgres
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${TP_DB_USER:-taskpilot}
      POSTGRES_PASSWORD: ${TP_DB_PASSWORD:-taskpilot_dev_2026}
      POSTGRES_DB: ${TP_DB_NAME:-taskpilot_dev}
    volumes:
      - ${HOME}/.local/share/taskpilot/postgres/shared:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./init-int-db.sql:/docker-entrypoint-initdb.d/03-init-int-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  litellm:
    # Gepinnt auf Backend-litellm-Version (1.92.0) — main-latest ist deprecated
    # und hing auf 1.82.6 mit veralteten Capability-/Preisdaten.
    image: ghcr.io/berriai/litellm:v1.92.0
    container_name: taskpilot-litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Nur die 4 LLM-Keys (TP_*) gelangen in den Proxy (Least Privilege).
    # Datei im Repo-Root, gleiche Konvention wie backend-prod (../.env.prod).
    env_file:
      - path: ../.env.litellm
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - taskpilot-shared
    restart: unless-stopped

  # Sandbox-Executor: der EINZIGE Dienst mit docker.sock-Zugriff. Startet nur das
  # gehaertete Image taskpilot-sandbox:latest mit fest verdrahteten Flags. Backend
  # (dev bare-metal via 127.0.0.1:8090, int/prod via Container-Name im
  # taskpilot-shared-Netz) ruft ihn token-geschuetzt per HTTP.
  sandbox-executor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox-executor
    image: taskpilot-sandbox-executor:latest
    container_name: taskpilot-sandbox-executor
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      TP_SANDBOX_IMAGE: taskpilot-sandbox:latest
      # Snap-Docker: Arbeitsverzeichnis unter $HOME und PFADGLEICH gemountet,
      # damit die an `docker run -v` uebergebenen Pfade auf dem Host existieren.
      TP_SANDBOX_OUTPUT_DIR: ${HOME}/.local/share/taskpilot/sandbox-output
      # Strikte(re)s Seccomp-Profil optional aktivieren (leer = Docker-Default):
      # TP_SANDBOX_SECCOMP: /opt/sandbox/seccomp-profile.json
    env_file:
      # Nur der Bearer-Token gelangt in den Executor (Least Privilege, wie .env.litellm).
      - path: ../.env.sandbox
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.local/share/taskpilot/sandbox-output:${HOME}/.local/share/taskpilot/sandbox-output
    networks:
      - default
      - taskpilot-shared
    restart: unless-stopped

  clamav:
    image: clamav/clamav-debian:unstable
    container_name: taskpilot-clamav-dev
    profiles: [clamav]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep -q PONG"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  clamav-data:

networks:
  # Projekt-uebergreifendes Netz, damit backend-prod (separates Compose-Projekt)
  # den LiteLLM-Proxy ueber den Container-Namen erreicht. Einmalig anlegen:
  #   docker network create taskpilot-shared   (passiert automatisch via Makefile)
  taskpilot-shared:
    external: true
