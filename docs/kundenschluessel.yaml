# Was sich nicht eindeutig zuordnen laesst. Wird nicht geraten --
# hier steht die Frage, bis ein Mensch sie beantwortet.
offen:
  - system: pipedrive
    kennung: 652
    name: Kanton Bern
    frage: >-
      155'000 CHF gewonnen unter dem Dach «Kanton Bern». Welches Amt hat den
      Auftrag tatsächlich vergeben? Solange das offen ist, darf der Betrag
      keiner Kundschaft zugerechnet werden.

  - system: pipedrive
    kennung: 724
    name: Bildung und Kultur im Kanton Bern
    frage: >-
      191'720 CHF gewonnen. Die Bildungs- und Kulturdirektion ist die
      vorgesetzte Stelle des Mittelschul- und Berufsbildungsamts. Derselbe
      Auftraggeber wie «mba» oder eine eigene Kundschaft?

  - system: pipedrive
    kennung: 552
    name: Beyond Civic
    frage: >-
      Kannst du mir die passende Kennung aus Bexio oder Toggl nennen, oder
      handelt es sich um einen neuen Kunden ohne Alias in den anderen Systemen?

  - system: bexio
    kennung: 96
    name: Schlossberg Thun AG
    frage: >-
      Gehört 'Schlossberg Thun AG' zu einem der bereits bekannten Schlüssel
      (z.B. stadt-thun) oder ist es ein neuer Kunde? Bitte nennen Sie die
      passende Toggl- oder Pipedrive-Kennung, falls bekannt.

  - system: bexio
    kennung: 108
    name: Zentrum Xung macht Yung
    frage: >-
      Gehört 'Zentrum Xung macht Yung' zu einem der bekannten Partner (z.B.
      Stadt Bern) oder ist es ein neuer, unabhängiger Kunde?

  - system: bexio
    kennung: 138
    name: decidim.swiss
    frage: >-
      Handelt es sich bei «decidim.swiss» um die Firma Beyond Civic GmbH
      (Pipedrive ID 552) oder um ein eigenes Kundenkonto/Projekt?

  - system: pipedrive
    kennung: 667
    name: Sourcing Partner
    frage: >-
      Handelt es sich bei 'Sourcing Partner' um einen neuen Kunden oder gehört
      er zu einer der bereits bekannten Kundschaften? Bitte um kurze Klärung.
