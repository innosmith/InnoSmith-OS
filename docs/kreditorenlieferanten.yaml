    # Kein Lieferant, sondern ein Absender: auf allen Google-Rechnungen steht
    # «Google», ob Workspace, Cloud, One oder YouTube. Im Archiv entscheidet der
    # Ordner, im Eingang nur der Absender — deshalb führt das Modul dort jede
    # Google-Rechnung unter diesem Schlüssel (25.09.2026: Workspace 30.11.2025,
    # Workspace 31.08.2026, Cloud 31.08.2026). Gebucht wird nie hierauf; am
    # Beleg wird gewählt, welcher Dienst es ist.
    # Der Ordner «Google» selbst hält nur noch «2025/Google Cloud Test 02.05.2025».
    aufteilen: [google_workspace, google_cloud, google_one, youtube, google_gemini]
    aktiv: true
    bestaetigt: false

  - schluessel: google_cloud
    ordner: Google Cloud
    schreibweisen: ["Google Cloud", "Google, Cloud"]   # Journal 2026: «Google Cloud,»
    # Keine Leistung: die Archivnamen tragen keine («Google Cloud 31.08.2026 KK»),
    # und was verrechnet wird, hängt am Verbrauch — am Beleg erfassen.
    sollkonto: "6570"   # alle Google-Buchungen 2025–2026 auf 6570 gegen 2120
    zahlweg: karte
    steuer:
      - ab: 2026-03-31
        behandlung: inland_mwst   # 4 von 4 gelesenen weisen MWST aus, 2 ungelesen
    rhythmus: monatlich   # 6 belegte Monate, 2026-03..2026-08
    aktiv: true
    bestaetigt: false

  - schluessel: google_gemini
    ordner: Google Gemini
    # Prepaid-Guthaben für die Gemini-API. Eigener Ordner, damit die Aufladung
    # nicht zwischen den Monatsrechnungen von Google Cloud untergeht.
    # Die Monatsrechnungen, die aus dem Guthaben bezahlt werden, werden nur
    # abgelegt, nicht gebucht (Entscheid 25.09.2026). Wie sie erkannt werden,
    # wird festgelegt, sobald die erste kommt — bis dahin kein Takt.
    schreibweisen: ["Google, Gemini"]   # Journal 2026: «Google, Gemini API»
    leistung: "Prepaid"
    sollkonto: "6570"
    zahlweg: karte
    steuer:
      - ab: null
        behandlung: unbekannt   # noch keine Rechnung im Modul gelesen
    rhythmus: unbekannt
    aktiv: true
    bestaetigt: false

