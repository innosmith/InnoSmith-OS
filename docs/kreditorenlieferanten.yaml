# Was niemand entscheiden konnte. Steht im Wortlaut, nicht als Etikett —
# eine Frage, die niemand hört, ist so gut wie keine.
offen:
  - >-
      Rüedu hat sechs Lieferantenrechnungen in Bexio, aber unter keiner Schreibweise des Namens eine Journalbuchung. Unter welchem Text laufen sie?
  - >-
      Der Ordner «Spesen» sammelt Quittungen (Business-Lunch, gelegentlich Büromaterial) statt eines einzelnen Lieferanten. Er trägt deshalb keine Kontoerwartung; die Belegart entscheidet im Register.
  - >-
      Post: die letzte Rechnung (2025-09-19, Einschreiben (R) (A)) weist MWST aus, die 3 davor nicht — 2020-04-08 PostPac Priority bis 2 kg; 2021-03-26 Postverzollung (Zollgebühren); 2021-04-19 Briefmarken (Markenheftchen). Ein Wechsel, ein Lesefehler, oder hängt die Behandlung an der Leistung statt am Lieferanten? Ein einzelner Beleg trägt keine Erwartung — was im Eintrag steht, kommt aus dem Journal, nicht aus den Rechnungen.

