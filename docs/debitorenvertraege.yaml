# Die eigenen Projekte ohne Kundschaft. Sie tragen «keine Verrechnung», und sie
# stehen hier **namentlich** statt als Regel «kein Vertrag heisst intern».
#
# Der Unterschied entscheidet einen stillen Fehler: ein neu angelegtes
# Kundenprojekt, von dem diese Datei noch nichts weiss, hätte unter der Regel
# stillschweigend «keine Verrechnung» erhalten — verrechenbare Stunden, als
# unverrechenbar abgestempelt, und niemand hätte es gemerkt. Namentlich
# deklariert fällt es stattdessen als «Projekt ohne Zuordnung» auf und wird
# nicht getaggt.
