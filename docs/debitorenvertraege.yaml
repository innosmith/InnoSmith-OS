  - schluessel: matrics
    empfaenger: martin.smith@matrics.co.uk
    ablage: 'MATRICS Consult Ltd'
    bestaetigt: true
    hinweis: >-
      Stand nie in der alten Konfiguration -- die Rechnung lief immer von Hand.
