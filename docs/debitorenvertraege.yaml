  - schluessel: bfh
    empfaenger: sylvia.batt@bfh.ch
    ablage: 'Berner Fachhochschule'
    verrechnungsart: Fixpreis
    bestaetigt: true
    hinweis: >-
      Bildungsleistungen sind von der Mehrwertsteuer befreit. Der Satz steht
      trotzdem am einzelnen Vertrag und nicht hier: eine BFH-Leistung ausserhalb
      der Lehre wäre wieder steuerpflichtig. Die Verrechnungsart steht dagegen
