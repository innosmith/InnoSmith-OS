    ablage: 'Gemeinde Köniz'
    bestaetigt: true

  - schluessel: stadt-bern
    empfaenger: peter.renfer@bern.ch
    ablage: 'Stadt Bern'
    bestaetigt: true

  - schluessel: t-r
    empfaenger: martin.roethlisberger@t-r.ch
    ablage: 'T+R'
    bestaetigt: false

  - schluessel: gsw
