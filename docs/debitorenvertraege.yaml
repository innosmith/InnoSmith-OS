  - schluessel: overpar
    empfaenger: dietmar.treichel@spiralsquare.com
    ablage: 'Overpar Solutions AG'
    bestaetigt: true
    hinweis: >-
      Die Coachings laufen unter «Spiral Square», fakturiert wird an die Overpar
      Solutions AG (bestätigt 21.09.2026). Der Empfänger bleibt die Adresse bei
