# Debitorenverträge — was je Projekt vereinbart ist
#
# Übertragen aus `config.yml` von InnoSmithAdmin, Stand 20.09.2026. Die Datei
# ersetzt dort drei Abschnitte: `projects`, `settings.referenz_pflicht_kunden`
# und `customers`. Sie ist das Stammdatum, gegen das die Rechnungsprüfung
# (`app/services/debitoren_pruefung.py`) misst.
#
# ## Warum das ein Stammdatum ist und kein Text
#
# Die vereinbarten Fixstunden standen bisher nirgends deklariert. Sie wurden aus
# dem Positionstext der Bexio-Rechnung zurückgelesen, mit zwei regulären
# Ausdrücken, die sich nicht einig waren: `admin_core` verlangte «Xh fix
# inklusive», `D2_updateDraftRechnungen` begnügte sich mit «Xh/Monat fix», und
# beide akzeptierten nur ganze Zahlen — ein Vertrag über 7.5 Stunden war nicht
# darstellbar. Wer den Text änderte, änderte damit unbemerkt den Vertrag.
#
# Hier steht die Zahl. Der Positionstext wird weiterhin gelesen, aber nur noch
# zum Abgleich: weicht er ab, ist das ein Befund und keine stille Übernahme.
#
# ## Aufbau
#
# `kunden`
#     Was für alle Projekte einer Kundschaft gilt: Empfänger, Referenzpflicht,
#     Ordnername im Archiv. Der `schluessel` zeigt auf `kundenschluessel.yaml`
#     und wird beim Laden dagegen geprüft — ein Vertrag, der auf eine
#     unbekannte Kundschaft zeigt, wird verworfen und gemeldet.
# `vertraege`
#     Was je Projekt gilt. Leere Felder bedeuten «Vorgabe der Kundschaft bzw.
#     des Systems», nicht «null».
# `interne_projekte`
#     Die eigenen Toggl-Projekte ohne Kundschaft. Namentlich, nicht als Regel
#     «kein Vertrag heisst intern» — siehe die Begründung am Block selbst.
#
# ## Die Verrechnungsart
#
# `verrechnungsart` benennt das Toggl-Tag, das nach bestätigtem Versand gesetzt
# wird, und erbt wie der Empfänger: Vorgabe, dann Kundschaft, dann Vertrag. Vier
# Werte sind zulässig (`Kunde verrechnet`, `Fixpreis`, `Extern rapportiert`,
# `keine Verrechnung`); ein fünfter wird bemängelt und nicht übernommen, weil
# Toggl einen unbekannten Tagnamen stillschweigend anlegt.
#
# Abgelesen statt entschieden: von 797 Buchungen zwischen Januar und August 2026
# tragen 639 genau die hier deklarierte Art, und keine eine andere. Die Zuordnung
# ist damit eine geschlossene Menge und gehört deklariert.
#
# Der Empfänger steht an der Kundschaft und nicht mehr am Projekt. In den 37
# übertragenen Projekten gibt es keinen Fall, in dem zwei Projekte derselben
# Kundschaft an verschiedene Adressen gingen — die Angabe stand 37-mal da, wo
# 11-mal genügt, und jede Wiederholung war eine Stelle, die abweichen konnte.
#
# ## Was hier bewusst fehlt
#
# * **Die Merge-Liste.** Rechnung und Leistungsrapport werden neu für alle
#   Kundschaften zu einem PDF zusammengeführt (bestätigt 20.09.2026). Damit
#   entfällt `settings.pdf_merge_kunden`.
# * **`match_keywords`.** Das war der Behelf, um aus dem Text eines erzeugten
#   PDFs auf das Projekt zurückzuschliessen. Die Zuordnung läuft künftig über
#   Kennungen; die Stichwörter stehen übergangsweise noch unter `erkennung`.
#
# ## Regeln
#
# * `bestaetigt: true` heisst «von einem Menschen geprüft». Voreingestellt ist
#   `false`: die Übertragung aus `config.yml` ist eine Maschinenleistung.
# * Wer `fix_stunden` setzt, muss auch `uebertragbar` setzen. Ohne die zweite
#   Angabe ist nicht entscheidbar, ob nicht verbrauchte Stunden in den Folgemonat
#   wandern — und die Prüfung meldet die Stundenregeln als offen, statt sich
#   für eine Lesart zu entscheiden.
# * Unsicherheit ist ein zulässiges Ergebnis. Was nicht feststeht, steht unter
#   `offen` und wird nicht geraten.

version: 1
stand: 2026-09-20

vorgaben:
  # Kann jährlich ändern. Bildungsleistungen sind steuerfrei und stehen am Vertrag.
  mwst: 8.1
  # Nur Bank-Identifikation, keine Kontonummer.
  iban_praefix: 'CH60 3080'
  anrede: ich
  # Das Toggl-Tag, das nach bestätigtem Versand gesetzt wird. Erbt wie der
  # Empfänger: Vorgabe, dann Kundschaft, dann Vertrag. Abgelesen aus Januar bis
  # August 2026 — dort trägt kein Projekt zwei verschiedene Arten, und ausser
  # den unten genannten trägt jedes verrechnete «Kunde verrechnet».
  verrechnungsart: Kunde verrechnet

