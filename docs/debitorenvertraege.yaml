    ablage: 'GSW Treuhand AG'
    bestaetigt: true

  - schluessel: wyss-academy
    bestaetigt: false
    hinweis: >-
      Trägt keinen Empfänger, weil aktuell kein Vertrag hierher fakturiert. Der
