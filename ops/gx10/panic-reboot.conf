# Ein Kernel-Panic soll neu starten, nicht stehenbleiben.
#
# Ziel dieser Datei: /etc/sysctl.d/60-gx10-panic.conf
#
# Ausgangslage auf dieser Maschine: /etc/modprobe.d/sbsa_gwdt.conf setzt
# `action=1`, der Watchdog löst beim ersten Timeout also einen Panic aus statt
# eines Resets. Zusammen mit der Vorgabe `kernel.panic = 0` endete die Kette
# damit in einem stehenden Kernel -- die Selbstheilung lief ins Leere.
#
# 10 Sekunden geben dem Kernel Zeit, die Panic-Meldung noch herauszuschreiben,
# bevor er neu startet.
kernel.panic = 10

# Ein Oops im NVIDIA-Treiber hinterlässt sonst ein halb funktionierendes System,
# das schwerer zu deuten ist als ein sauberer Neustart.
kernel.panic_on_oops = 1

# Bewusst NICHT gesetzt: kernel.hung_task_panic. Die Schwelle liegt bei 120 s,
# und ein langer I/O-Stall ist auf dieser Maschine kein Grund für einen Reboot.
