# Ziel: /etc/systemd/system/sysstat-collect.timer.d/minutentakt.conf
#
# sar sammelt auf dieser Maschine über den systemd-Timer, nicht über cron:
# /etc/default/sysstat steht auf ENABLED="false", wodurch der cron-Aufruf von
# debian-sa1 folgenlos bleibt. Die Vorgabe des Timers ist *:00/10.
#
# Beim Freeze vom 24.08.2026 lag der letzte Messpunkt dadurch sechs Minuten
# vor dem Ereignis -- zu grob, um eine Speicherspitze in den Schlusssekunden
# zu erkennen.

[Timer]
# Erst leeren: OnCalendar ist additiv, sonst gälte die Vorgabe weiterhin.
OnCalendar=
OnCalendar=*:00/1
