# Hardware-Watchdog der GX10 (SBSA Generic Watchdog, /dev/watchdog0).
#
# Ziel: Ein Hard-Lock soll die Maschine nicht bis zum manuellen Power-Cycle
# stilllegen. systemd füttert den Watchdog periodisch; bleibt das aus, löst
# die Hardware selbstständig einen Reset aus.
#
# 120 Sekunden sind bewusst grosszügig gewählt, damit ein langer I/O-Stall
# keinen unnötigen Reset auslöst. Der Treiber meldet unter max_timeout eine
# 0 (keine Obergrenze angegeben) -- der tatsächlich übernommene Wert muss
# nach der Aktivierung in /sys/class/watchdog/watchdog0/timeout geprüft
# werden.
#
# Ziel dieser Datei: /etc/systemd/system.conf.d/watchdog.conf

[Manager]
RuntimeWatchdogSec=120
RebootWatchdogSec=10min
