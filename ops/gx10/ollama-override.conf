# Ollama auf der GX10 (DGX Spark, GB10).
#
# Ziel dieser Datei: /etc/systemd/system/ollama.service.d/override.conf
#
# OLLAMA_FLASH_ATTENTION=0 ist der Kern dieser Datei und der Grund, weshalb sie
# überhaupt versioniert wird. Mit `1` startet jeder Runner mit `--flash-attn on`,
# und genau dieser Kernel greift auf dem GB10 gelegentlich knapp neben die
# Allokation. Auf einer gewöhnlichen Grafikkarte landet der Zugriff im Seitenrand
# und bleibt folgenlos; im kohärenten Unified Memory des GB10 löst er einen
# Hardware-Page-Fault aus, der die ganze Maschine mitnimmt -- ohne dass Ollama
# noch einen CUDA-Fehler schreiben könnte.
#
# Belegt in ollama#17434 (qwen3.6 auf DGX Spark GB10 arm64: «OLLAMA_FLASH_ATTENTION=0
# clears the crash completely») und ollama#17596 (derselbe Kernel bei grossem
# Prefill). Herleitung und Messdaten: docs/gx10-freeze-befund.md.
#
# Der Verzicht kostet nichts ausser etwas KV-Cache-Speicher, und davon ist bei
# 128 GB Unified Memory genug da. Modelle, Kontextfenster, Vision und Werkzeuge
# bleiben unverändert.

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_NUM_PARALLEL=3"
Environment="OLLAMA_CONTEXT_LENGTH=65536"
Environment="OLLAMA_FLASH_ATTENTION=0"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
